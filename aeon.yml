# Aeon configuration — research, writing, curated news
#
# Schedules are in UTC. Adjust to match your timezone.
# Eastern Time (ET): UTC-4 summer, UTC-5 winter
# e.g. 8 AM ET (summer) = 12 PM UTC = "0 12 * * *"

skills:

  # --- Morning (8 AM ET = 12 PM UTC) ---
  morning-brief: { enabled: true, schedule: "0 12 * * *" }
  rss-digest: { enabled: true, schedule: "0 12 * * *" }            # configure feeds in MEMORY.md
  hacker-news-digest: { enabled: false, schedule: "0 12 * * *" }   # top HN stories — enable for tech news
  paper-digest: { enabled: false, schedule: "0 12 * * *" }         # academic papers — enable if useful
  reddit-digest: { enabled: false, schedule: "0 12 * * *" }        # subreddits — configure in MEMORY.md

  # --- Afternoon — research & ideas (2 PM ET = 6 PM UTC) ---
  research-brief: { enabled: true, schedule: "0 18 * * *" }
  idea-capture: { enabled: true, schedule: "0 18 * * *" }
  digest: { enabled: false, schedule: "0 18 * * *" }
  paper-pick: { enabled: false, schedule: "0 18 * * *" }           # single best paper of the day

  # --- On-demand (trigger manually via GitHub Actions) ---
  deep-research: { enabled: false, schedule: "workflow_dispatch", var: "" }     # set var to research topic
  article: { enabled: false, schedule: "workflow_dispatch", var: "" }           # set var to essay topic
  technical-explainer: { enabled: false, schedule: "workflow_dispatch", var: "" }
  create-skill: { enabled: false, schedule: "workflow_dispatch", var: "" }      # build new skills

  # --- Evening (9 PM ET = 1 AM UTC) ---
  reflect: { enabled: true, schedule: "0 1 * * *" }
  goal-tracker: { enabled: true, schedule: "0 1 * * *" }
  evening-recap: { enabled: false, schedule: "0 1 * * *", model: "claude-sonnet-4-6" }

  # --- Weekly ---
  weekly-review: { enabled: true, schedule: "0 22 * * 1" }        # Monday 6 PM ET
  cost-report: { enabled: true, schedule: "0 12 * * 1", model: "claude-sonnet-4-6" } # Monday 8 AM ET

  # --- Meta / Self-healing ---
  heartbeat: { enabled: true, schedule: "0 8,14,20 * * *" }
  skill-health: { enabled: true, schedule: "0 0 * * *", model: "claude-sonnet-4-6" }
  self-improve: { enabled: false, schedule: "0 18 1/2 * *" }
  skill-repair: { enabled: false, schedule: "reactive", var: "" }
  skill-evals: { enabled: false, schedule: "0 6 * * 0", model: "claude-sonnet-4-6" }

# Reactive triggers
reactive:
  # skill-repair:
  #   trigger:
  #     - { on: "*", when: "consecutive_failures >= 3" }

# Chains — multi-step pipelines (configure later)
chains:
  # morning-routine:
  #   schedule: "0 12 * * *"
  #   steps:
  #     - parallel: [rss-digest, research-brief]
  #     - skill: morning-brief, consume: [rss-digest, research-brief]

# Default model
model: claude-opus-4-7

# Gateway
gateway:
  provider: direct

# Output channels
channels:
  jsonrender:
    enabled: true

# Messaging — set up Telegram later
telegram:
  enabled: false